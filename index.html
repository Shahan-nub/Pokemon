<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Be My Valentine</title>
    <link rel="stylesheet" href="css/valentine.css" />
  </head>
  <body>
    <div id="valentineQuestion"><b>Will you be my Pikachu?</b></div>
    <button class="answerButton" onclick="location.href='thankyou.html'">
      Yes
    </button>
    <button class="answerButton" id="noButton">I no no wanna o(╥﹏╥)o</button>
    <br />
    <div class="gifs-row">
      <div
        class="tenor-gif-embed"
        data-postid="5327560302222529519"
        data-share-method="host"
        data-aspect-ratio="1.33155"
        data-width="100%"
      >
        <a
          href="https://tenor.com/view/pokemon-pikachu-crying-cry-sad-gif-5327560302222529519"
          >Pokemon Pikachu GIF</a
        >
        from
        <a href="https://tenor.com/search/pokemon-gifs">Pokemon GIFs</a>
      </div>

      <div
        class="tenor-gif-embed"
        data-postid="4026200563136038701"
        data-share-method="host"
        data-aspect-ratio="1.31746"
        data-width="100%"
      >
        <a
          href="https://tenor.com/view/pokemon-pok%C3%A9mon-pokemon-ash-ash-ash-ketchum-gif-4026200563136038701"
          >Pokemon Pokémon GIF</a
        >
        from
        <a href="https://tenor.com/search/pokemon-gifs">Pokemon GIFs</a>
      </div>
    </div>
    <script type="text/javascript" async src="https://tenor.com/embed.js"></script>

    <script>
      document
        .getElementById("noButton")
        .addEventListener("click", function () {
          var yesButton = document.querySelector(
            'button[onclick*="thankyou.html"]'
          );
          var currentFontSize = parseInt(
            window.getComputedStyle(yesButton).fontSize
          );
          yesButton.style.fontSize = currentFontSize + 10 + "px"; // Increase font size by 5px
        });
    </script>
    <script src="js/survey.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var yesButton = document.querySelector('button[onclick*="thankyou.html"]');
        if (yesButton) {
          yesButton.addEventListener("click", function () {
            window.valentineSurvey.setValue("decision", "Yes");
          });
        }

        var noButton = document.getElementById("noButton");
        if (noButton) {
          noButton.addEventListener("click", function () {
            window.valentineSurvey.setValue("decision", "No");
          });
        }
      });
    </script>
  </body>
</html>
